# --- Number components (portions per time, calibration & emergency schedule) ---
number:
  - platform: template
    id: manual_portions
    name: "Manual Portions"
    min_value: 1
    max_value: 6
    step: 1
    initial_value: 1
    restore_value: true
    optimistic: true
    mode: box
    set_action: []
    web_server:
      sorting_group_id: group_status
      sorting_weight: 31

  - platform: template
    id: gram_per_portion
    name: "Grams per Portion"
    min_value: 1.0
    max_value: 10.0
    step: 0.1
    initial_value: 3.5
    restore_value: true
    optimistic: true
    mode: box
    set_action: []
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 10

  - platform: template
    id: max_daily_portions
    name: "Max Portions per Day (schedule limit)"
    min_value: 1
    max_value: 40
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    mode: box
    set_action: []
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 11

  # How long the motor runs backwards during unjam (adjustable without reflashing).
  # One portion = 120° in ~3.5 s (~34°/s); 1200 ms = ~41° backwards.
  - platform: template
    id: unjam_reverse_ms
    name: "Unjam Reverse Time (ms)"
    unit_of_measurement: "ms"
    min_value: 200
    max_value: 1500
    step: 50
    initial_value: 1200
    restore_value: true
    optimistic: true
    mode: box
    set_action: []
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 12

  - platform: template
    id: emergency_interval_hours
    name: "Emergency Feeding Interval (hours)"
    min_value: 1
    max_value: 12
    step: 1
    initial_value: 4
    restore_value: true
    optimistic: true
    mode: box
    set_action: []
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 21

  - platform: template
    id: emergency_portions
    name: "Emergency Feeding Portions (0 = auto from schedule)"
    min_value: 0
    max_value: 6
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    set_action: []
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 22

  # 8 feeding times - Portions (0 = disabled)

# ==============================================================================
# Pet Feeder (Petlibro Air PLAF108 - ESP32-C3)
# ESPHome configuration with Web Server v3, 8 feeding times & advanced emergency fallback
# ==============================================================================

esphome:
  name: petlibro-plaf108
  friendly_name: "Petlibro Air Feeder"

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: arduino

logger:
  baud_rate: 0
  level: INFO

# --- Network & connections ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Prevents an automatic reboot after 15 min without wifi, so millis() can reach the emergency interval
  reboot_timeout: 0s
  ap:
    ssid: "Petlibro Feeder Fallback"
    password: !secret ap_password

captive_portal:

mdns:

api:
  # Prevents a reboot after 15 min without an active Home Assistant connection
  reboot_timeout: 0s
  # Optionally enable for an encrypted connection (requires the key in Home Assistant):
  # encryption:
  #   key: !secret api_key

ota:
  platform: esphome
  # Optional OTA password:
  # password: !secret ota_password

# --- Time synchronisation (NTP) ---
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam"
    on_time:
      - seconds: 0
        then:
          - script.execute: check_schedules
    on_time_sync:
      then:
        - script.execute: check_schedules

# --- Web Server v3 (three ordered cards) ---
web_server:
  port: 80
  version: 3
  # Optionally enable to protect the web interface with a username/password:
  # auth:
  #   username: !secret web_user
  #   password: !secret web_pass
  sorting_groups:
    - id: group_status
      name: "Status & Manual Control"
      sorting_weight: 10
    - id: group_schedules
      name: "Feeding Schedule (8 Times)"
      sorting_weight: 20
    - id: group_settings
      name: "Settings & Emergency Protection"
      sorting_weight: 30

# ==============================================================================
# HARDWARE CONFIGURATION
# ==============================================================================

# Status LED on front panel
status_led:
  pin:
    number: GPIO3
    mode:
      output: true

# Motor & Alarm LED outputs
output:
  - platform: gpio
    pin: GPIO6
    id: motor_forward_pin
  - platform: gpio
    pin: GPIO7
    id: motor_reverse_pin
  - platform: gpio
    pin: GPIO10
    id: alarm_led_pin

# ==============================================================================
# GLOBAL VARIABLES (RAM vs FLASH)
# ==============================================================================

globals:
  # Dynamic operational states (RAM only: no flash wear)
  - id: dose_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: jam_detected
    type: bool
    restore_value: no
    initial_value: "false"

  - id: portions_remaining
    type: int
    restore_value: no
    initial_value: "0"

  - id: total_portions_in_run
    type: int
    restore_value: no
    initial_value: "0"

  - id: microswitch_click_count
    type: int
    restore_value: no
    initial_value: "0"

  - id: last_emergency_feed_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_schedule_key
    type: int
    restore_value: no
    initial_value: "-1"

  # Daily tracking counter (Stored in flash NVS, resets daily at midnight)
  - id: daily_fed_portions_count
    type: int
    restore_value: yes
    initial_value: "0"

# ==============================================================================
# HARDWARE SENSORS & STATUS SENSORS
# ==============================================================================

binary_sensor:
  # Microswitch (detection cam motor): internal, filtered via script
  - platform: gpio
    id: microswitch
    pin:
      number: GPIO8
      inverted: true
      mode:
        input: true
        pullup: true
    internal: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - lambda: |-
            if (id(dose_active)) {
              id(microswitch_click_count)++;
              ESP_LOGD("feeder", "Microswitch click detected: #%d", id(microswitch_click_count));
            }

  # Reset button on rear (manual 1-portion feed on single press)
  - platform: gpio
    id: physical_reset_button
    pin:
      number: GPIO19
      mode:
        input: true
        pullup: true
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - script.execute:
            id: dispense_multiple_portions
            count: 1

  # Hopper food sensor (photodiode / IR sensor with debounce)
  - platform: gpio
    id: raw_food_sensor
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    internal: true
    filters:
      - delayed_on: 1s
      - delayed_off: 1s
    on_state:
      then:
        - component.update: food_hopper_status

  # Problem sensor for Home Assistant (binary_sensor with problem device_class)
  - platform: template
    name: "Feeder Fault"
    id: feeder_fault_sensor
    device_class: problem
    web_server:
      sorting_group_id: group_status
      sorting_weight: 15
    lambda: |-
      return id(jam_detected);

  # Feeding in progress indicator
  - platform: template
    name: "Dispensing in Progress"
    id: feeder_dispensing_sensor
    device_class: running
    web_server:
      sorting_group_id: group_status
      sorting_weight: 16
    lambda: |-
      return id(dose_active);

  # Power supply status (Mains connected)
  - platform: gpio
    id: raw_mains_connected
    name: "Mains Power Connected"
    device_class: power
    pin:
      number: GPIO5
      inverted: true
      mode:
        input: true
        pullup: true
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 40
    on_state:
      then:
        - component.update: power_source_text

  # Battery presence sensor
  - platform: gpio
    id: raw_battery_plugged_in
    name: "Backup Battery Installed"
    pin: GPIO4
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 41
    on_state:
      then:
        - component.update: power_source_text

# ==============================================================================
# ANALOG SENSORS & SYSTEM METRICS
# ==============================================================================

sensor:
  - platform: uptime
    name: "Uptime"
    id: feeder_uptime
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 45

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_dbm
    update_interval: 60s
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 46

  # Planned portions sum for today
  - platform: template
    name: "Planned Portions (Daily)"
    id: planned_daily_portions
    icon: "mdi:calculator"
    unit_of_measurement: "portions"
    accuracy_decimals: 0
    web_server:
      sorting_group_id: group_status
      sorting_weight: 4
    lambda: |-
      int total = 0;
      total += (int) id(sch1_portions).state;
      total += (int) id(sch2_portions).state;
      total += (int) id(sch3_portions).state;
      total += (int) id(sch4_portions).state;
      total += (int) id(sch5_portions).state;
      total += (int) id(sch6_portions).state;
      total += (int) id(sch7_portions).state;
      total += (int) id(sch8_portions).state;
      return (float) total;
    on_value:
      then:
        - component.update: planned_daily_grams
        - component.update: portions_fed_today_text

  # Planned total grams based on planned portions * grams per portion
  - platform: template
    name: "Planned Grams (Daily)"
    id: planned_daily_grams
    icon: "mdi:weight-gram"
    unit_of_measurement: "g"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: group_status
      sorting_weight: 5
    lambda: |-
      return id(planned_daily_portions).state * id(gram_per_portion).state;

# ==============================================================================
# TEXT SENSORS (CLEAN WEB SERVER DISPLAY)
# ==============================================================================

text_sensor:
  # Feeder state: Idle, Dispensing, Stalled
  - platform: template
    name: "Feeder State"
    id: feeder_state
    icon: "mdi:information-outline"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 1
    lambda: |-
      if (id(jam_detected)) {
        return std::string("FAULT: Motor Stalled / Jammed");
      }
      if (id(dose_active)) {
        char buf[48];
        snprintf(buf, sizeof(buf), "Dispensing (%d portions left)", id(portions_remaining));
        return std::string(buf);
      }
      return std::string("Idle (Ready)");

  # Today's fed portions display
  - platform: template
    name: "Portions Fed Today"
    id: portions_fed_today_text
    icon: "mdi:counter"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 2
    lambda: |-
      char buf[48];
      snprintf(buf, sizeof(buf), "%d / %d portions",
               id(daily_fed_portions_count), (int) id(planned_daily_portions).state);
      return std::string(buf);

  # Today's fed grams display
  - platform: template
    name: "Grams Fed Today"
    id: grams_fed_today_text
    icon: "mdi:scale"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 3
    lambda: |-
      float fed_grams = id(daily_fed_portions_count) * id(gram_per_portion).state;
      float planned_grams = id(planned_daily_portions).state * id(gram_per_portion).state;
      char buf[48];
      snprintf(buf, sizeof(buf), "%.1f / %.1f g", fed_grams, planned_grams);
      return std::string(buf);

  # Last feeding timestamp
  - platform: template
    name: "Last Feeding"
    id: last_feeding_time
    icon: "mdi:clock-check-outline"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 6

  # Hopper stock status
  - platform: template
    name: "Food Hopper Status"
    id: food_hopper_status
    icon: "mdi:silo"
    web_server:
      sorting_group_id: group_status
      sorting_weight: 7
    lambda: |-
      if (id(raw_food_sensor).state) {
        return std::string("Attention: hopper almost empty / refill!");
      }
      return std::string("Enough kibble in stock");

  # Power source indicator
  - platform: template
    name: "Power Source"
    id: power_source_text
    icon: "mdi:power-plug"
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 42
    lambda: |-
      if (id(raw_mains_connected).state) {
        return std::string("Mains Adapter (OK)");
      }
      if (id(raw_battery_plugged_in).state) {
        return std::string("Running on Backup Battery!");
      }
      return std::string("Unknown / No Battery");


# Hardware control switches (Sensors permanently active, raw motor pins internal)
switch:
  - platform: gpio
    pin: GPIO9
    id: food_sensor_power
    name: "Food Sensor Power"
    restore_mode: ALWAYS_ON
    internal: true

# ==============================================================================
# CONTROL LOGIC & SCRIPTS
# ==============================================================================

script:
  # ----------------------------------------------------------------------------
  # SINGLE DOSE DISPENSE WITH MICROSWITCH TIMING & STALL DETECTION
  # ----------------------------------------------------------------------------
  - id: dispense_one_dose
    mode: single
    then:
      - lambda: |-
          id(microswitch_click_count) = 0;
          ESP_LOGI("feeder", "Starting single dose...");
      - output.turn_on: motor_forward_pin

      # Phase 1: Cam leaves the microswitch (normally ~1.2 s, timeout: 2.0 s)
      - wait_until:
          condition:
            lambda: 'return id(microswitch_click_count) >= 1;'
          timeout: 2.0s

      - if:
          condition:
            lambda: 'return id(microswitch_click_count) < 1;'
          then:
            - output.turn_off: motor_forward_pin
            - ESP_LOGW("feeder", "Stall detected in phase 1 (switch did not release within 2s)!");
            - script.execute: unjam_routine
            - wait_until:
                condition:
                  lambda: 'return !id(unjam_routine).is_running();'
            # Retry after unjam
            - lambda: |-
                id(microswitch_click_count) = 0;
            - output.turn_on: motor_forward_pin
            - wait_until:
                condition:
                  lambda: 'return id(microswitch_click_count) >= 1;'
                timeout: 2.0s
            - if:
                condition:
                  lambda: 'return id(microswitch_click_count) < 1;'
                then:
                  - output.turn_off: motor_forward_pin
                  - script.execute: raise_fault
                  - script.stop: dispense_one_dose

      # Phase 2: Cam completes turn to next switch position (normally ~2.3 s after click 1, timeout: 4.0 s)
      - wait_until:
          condition:
            lambda: 'return id(microswitch_click_count) >= 2;'
          timeout: 4.0s

      - if:
          condition:
            lambda: 'return id(microswitch_click_count) < 2;'
          then:
            - output.turn_off: motor_forward_pin
            - ESP_LOGW("feeder", "Stall detected in phase 2 (switch did not click 2nd time within 4s)!");
            - script.execute: unjam_routine
            - wait_until:
                condition:
                  lambda: 'return !id(unjam_routine).is_running();'
            # Retry phase 2 after unjam
            - output.turn_on: motor_forward_pin
            - wait_until:
                condition:
                  lambda: 'return id(microswitch_click_count) >= 2;'
                timeout: 4.0s
            - if:
                condition:
                  lambda: 'return id(microswitch_click_count) < 2;'
                then:
                  - output.turn_off: motor_forward_pin
                  - script.execute: raise_fault
                  - script.stop: dispense_one_dose

      # Normal successful dose completion
      - output.turn_off: motor_forward_pin
      - delay: 200ms
      - ESP_LOGI("feeder", "Single dose finished successfully.");

  # ----------------------------------------------------------------------------
  # MULTI-PORTION DISPENSE LOOP WITH SAFETY CAPPING
  # ----------------------------------------------------------------------------
  - id: dispense_multiple_portions
    mode: single
    parameters:
      count: int
    then:
      - if:
          condition:
            lambda: 'return id(jam_detected);'
          then:
            - ESP_LOGE("feeder", "Cannot dispense: Feeder is in FAULT state!");
            - script.stop: dispense_multiple_portions

      - lambda: |-
          id(dose_active) = true;
          id(portions_remaining) = count;
          id(total_portions_in_run) = count;
          id(feeder_dispensing_sensor).publish_state(true);
          id(feeder_state).publish_state("Dispensing...");

      - while:
          condition:
            lambda: 'return id(portions_remaining) > 0 && !id(jam_detected);'
          then:
            - script.execute: dispense_one_dose
            - wait_until:
                condition:
                  lambda: 'return !id(dispense_one_dose).is_running();'

            - if:
                condition:
                  lambda: 'return !id(jam_detected);'
                then:
                  - lambda: |-
                      id(portions_remaining)--;
                      id(daily_fed_portions_count)++;
                      ESP_LOGI("feeder", "Portion completed. Remaining: %d. Total fed today: %d",
                               id(portions_remaining), id(daily_fed_portions_count));
                  - component.update: portions_fed_today_text
                  - component.update: grams_fed_today_text
                  - delay: 400ms

      - lambda: |-
          id(dose_active) = false;
          id(portions_remaining) = 0;
          id(feeder_dispensing_sensor).publish_state(false);

          if (!id(jam_detected)) {
            // Update last feeding text sensor
            auto time_now = id(sntp_time).now();
            char time_buf[64];
            if (time_now.is_valid()) {
              snprintf(time_buf, sizeof(time_buf), "%02d:%02d:%02d (%d portions)",
                       time_now.hour, time_now.minute, time_now.second, id(total_portions_in_run));
            } else {
              snprintf(time_buf, sizeof(time_buf), "Offline feed (%d portions)", id(total_portions_in_run));
            }
            id(last_feeding_time).publish_state(time_buf);
            id(feeder_state).publish_state("Idle (Ready)");
          }

  # ----------------------------------------------------------------------------
  # UNJAM ROUTINE: REVERSE FOR CONFIGURED DURATION
  # ----------------------------------------------------------------------------
  - id: unjam_routine
    mode: single
    then:
      - ESP_LOGW("feeder", "Unjam routine starting: stopping forward drive...");
      - output.turn_off: motor_forward_pin
      - delay: 250ms
      - ESP_LOGW("feeder", "Unjam routine: reversing motor for %.0f ms...", id(unjam_reverse_ms).state);
      - output.turn_on: motor_reverse_pin
      - delay: !lambda 'return (uint32_t) id(unjam_reverse_ms).state;'
      - output.turn_off: motor_reverse_pin
      - delay: 350ms
      - ESP_LOGI("feeder", "Unjam routine completed.");

  # ----------------------------------------------------------------------------
  # FAULT HANDLING (MOTOR STALL / HARD JAM)
  # ----------------------------------------------------------------------------
  - id: raise_fault
    mode: single
    then:
      - output.turn_off: motor_forward_pin
      - output.turn_off: motor_reverse_pin
      - lambda: |-
          id(jam_detected) = true;
          id(dose_active) = false;
          id(feeder_fault_sensor).publish_state(true);
          id(feeder_dispensing_sensor).publish_state(false);
          id(feeder_state).publish_state("FAULT: Motor Stalled / Jammed");
          ESP_LOGE("feeder", "CRITICAL: Feeder jammed! Motor stopped, alarm raised.");
      - output.turn_on: alarm_led_pin

  # Clear fault manually or automatically on next scheduled cycle
  - id: clear_fault
    mode: single
    then:
      - output.turn_off: alarm_led_pin
      - lambda: |-
          id(jam_detected) = false;
          id(feeder_fault_sensor).publish_state(false);
          id(feeder_state).publish_state("Idle (Ready)");
          ESP_LOGI("feeder", "Fault cleared.");

  # ----------------------------------------------------------------------------
  # RESET DAILY COUNTER (AT MIDNIGHT OR MANUALLY)
  # ----------------------------------------------------------------------------
  - id: reset_daily_counter
    mode: single
    then:
      - lambda: |-
          id(daily_fed_portions_count) = 0;
          ESP_LOGI("feeder", "Daily portion counter reset to 0.");
      - component.update: portions_fed_today_text
      - component.update: grams_fed_today_text

  # ----------------------------------------------------------------------------
  # SCHEDULE VERIFICATION & EXECUTION (CALLED EVERY MINUTE)
  # ----------------------------------------------------------------------------
  - id: check_schedules
    mode: single
    then:
      - lambda: |-
          auto time_now = id(sntp_time).now();

          // 1. If time is invalid (no WiFi/NTP), run offline emergency logic
          if (!time_now.is_valid()) {
            uint32_t now_ms = millis();
            uint32_t interval_ms = (uint32_t)(id(emergency_interval_hours).state * 3600.0f * 1000.0f);
            if (id(last_emergency_feed_ms) == 0 || (now_ms - id(last_emergency_feed_ms) >= interval_ms)) {
              id(last_emergency_feed_ms) = now_ms;
              int portions = (int) id(emergency_portions).state;
              ESP_LOGW("feeder", "Offline fallback active! Triggering %d emergency portions.", portions);
              id(dispense_multiple_portions).execute(portions);
            }
            return;
          }

          // 2. Midnight reset (00:00)
          if (time_now.hour == 0 && time_now.minute == 0) {
            id(reset_daily_counter).execute();
          }

          // 3. Clear faults if a new scheduled moment arrives
          if (id(jam_detected)) {
            id(clear_fault).execute();
          }

          // 4. Prevent duplicate execution within the same minute
          int key = time_now.day_of_year * 1440 + time_now.hour * 60 + time_now.minute;
          if (key == id(last_schedule_key)) return;
          id(last_schedule_key) = key;

          // Helper macro to test schedule moments
          #define MATCH_SCH(sch_num) \
            (time_now.hour == id(sch##sch_num##_time).hour && \
             time_now.minute == id(sch##sch_num##_time).minute && \
             (int) id(sch##sch_num##_portions).state > 0)

          int portions_to_dispense = 0;
          if (MATCH_SCH(1)) portions_to_dispense = (int) id(sch1_portions).state;
          else if (MATCH_SCH(2)) portions_to_dispense = (int) id(sch2_portions).state;
          else if (MATCH_SCH(3)) portions_to_dispense = (int) id(sch3_portions).state;
          else if (MATCH_SCH(4)) portions_to_dispense = (int) id(sch4_portions).state;
          else if (MATCH_SCH(5)) portions_to_dispense = (int) id(sch5_portions).state;
          else if (MATCH_SCH(6)) portions_to_dispense = (int) id(sch6_portions).state;
          else if (MATCH_SCH(7)) portions_to_dispense = (int) id(sch7_portions).state;
          else if (MATCH_SCH(8)) portions_to_dispense = (int) id(sch8_portions).state;

          #undef MATCH_SCH

          if (portions_to_dispense > 0) {
            int max_p = (int) id(max_daily_portions).state;
            if (id(daily_fed_portions_count) + portions_to_dispense > max_p) {
              ESP_LOGW("feeder", "Daily safety cap exceeded! Fed: %d, Requested: %d, Cap: %d. Cancelling.",
                       id(daily_fed_portions_count), portions_to_dispense, max_p);
              return;
            }
            id(dispense_multiple_portions).execute(portions_to_dispense);
          }

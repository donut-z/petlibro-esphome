# --- Buttons (control) ---
button:
  - platform: template
    name: "Dispense 1 Portion Now"
    on_press:
      - if:
          condition:
            lambda: 'return !id(dispense_in_progress);'
          then:
            - script.execute:
                id: dispense_multiple_portions
                count: 1
    web_server:
      sorting_group_id: group_status
      sorting_weight: 30

  - platform: template
    name: "Dispense Selected Portions"
    on_press:
      - if:
          condition:
            lambda: 'return !id(dispense_in_progress);'
          then:
            - lambda: |-
                id(dispense_multiple_portions).execute((int)id(manual_portions).state);
    web_server:
      sorting_group_id: group_status
      sorting_weight: 32

  - platform: template
    name: "Unjam Motor"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: 'return !id(dispense_in_progress);'
          then:
            - script.execute: unjam_routine
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 30

# --- Scripts (dispensing logic & emergency protection) ---
script:
  - id: dispense_single_portion
    mode: single
    then:
      - lambda: |-
          id(last_dispense_ok) = false;
          id(cam_left) = false;
          id(dispense_t0) = millis();
      - switch.turn_on: motor_right
      # 1. Wait until the cam releases the switch (sensor OFF, max 2 s)
      - wait_until:
          condition:
            binary_sensor.is_off: motor_rotation_sensor
          timeout: 2000ms
      # Remember whether the cam really released (otherwise the motor is stuck)
      - lambda: |-
          id(cam_left) = !id(motor_rotation_sensor).state;
          ESP_LOGI("feeder", "First click after %u ms (cam released: %s)",
                   (unsigned)(millis() - id(dispense_t0)), id(cam_left) ? "yes" : "NO");
      # 2. Wait until the next cam reaches the switch (sensor ON, max 4 s)
      - wait_until:
          condition:
            binary_sensor.is_on: motor_rotation_sensor
          timeout: 4s
      - switch.turn_off: motor_right
      - lambda: |-
          ESP_LOGI("feeder", "Rotation ended after %u ms (sensor %s)",
                   (unsigned)(millis() - id(dispense_t0)),
                   id(motor_rotation_sensor).state ? "ON" : "OFF");

      # Success = cam released AND back on the switch
      - if:
          condition:
            lambda: 'return id(cam_left) && id(motor_rotation_sensor).state;'
          then:
            - light.turn_off: gpio10_red_light
            - lambda: |-
                id(last_dispense_ok) = true;
                id(feeder_fault) = false;
          else:
            - light.turn_on: gpio10_red_light
            - script.execute: unjam_routine
            - script.wait: unjam_routine
            # unjam_routine sets feeder_fault: false = success
            - lambda: 'id(last_dispense_ok) = !id(feeder_fault);'

  - id: unjam_routine
    mode: single
    then:
      - lambda: 'id(cam_left) = false;'
      - switch.turn_on: motor_left
      - delay: !lambda 'return (uint32_t) id(unjam_reverse_ms).state;'
      - switch.turn_off: motor_left
      - lambda: |-
          ESP_LOGI("unjam", "Reversed %d ms, sensor now %s",
                   (int) id(unjam_reverse_ms).state,
                   id(motor_rotation_sensor).state ? "ON (cam still on switch)" : "OFF (cam released)");
      - delay: 350ms
      - switch.turn_on: motor_right
      # Did reversing pull the cam off the switch (sensor OFF)? Then first go back to
      # that starting cam, otherwise back-and-forth counts as a dispensed portion
      # although nothing was rotated net.
      - if:
          condition:
            binary_sensor.is_off: motor_rotation_sensor
          then:
            - wait_until:
                condition:
                  binary_sensor.is_on: motor_rotation_sensor
                timeout: 3s
      - wait_until:
          condition:
            binary_sensor.is_off: motor_rotation_sensor
          timeout: 2000ms
      # Remember whether the cam really released
      - lambda: 'id(cam_left) = !id(motor_rotation_sensor).state;'
      - wait_until:
          condition:
            binary_sensor.is_on: motor_rotation_sensor
          timeout: 4s
      - switch.turn_off: motor_right
      - if:
          condition:
            lambda: 'return id(cam_left) && id(motor_rotation_sensor).state;'
          then:
            - light.turn_off: gpio10_red_light
            - lambda: 'id(feeder_fault) = false;'
          else:
            - light.turn_on: gpio10_red_light
            - lambda: 'id(feeder_fault) = true;'
      # Update status immediately, but not in the middle of a dispensing round
      - lambda: |-
          if (!id(dispense_in_progress)) {
            id(feeder_status).publish_state(id(feeder_fault) ?
              "Fault: check motor / clear jam" : "Ready");
          }

  # Central safe dispensing loop with actual portion count
  - id: dispense_multiple_portions
    mode: single
    parameters:
      count: int
    then:
      - lambda: |-
          id(dispense_in_progress) = true;
          id(dispensed_ok_count) = 0;
          // Clear fault at the start of each round, otherwise an earlier fault
          // blocks all following feedings (schedule + emergency feeding)
          id(feeder_fault) = false;
          id(feeder_status).publish_state("Dispensing...");
      - repeat:
          count: !lambda 'return count;'
          then:
            - if:
                condition:
                  lambda: 'return !id(feeder_fault);'
                then:
                  - script.execute: dispense_single_portion
                  - script.wait: dispense_single_portion
                  - lambda: |-
                      if (id(last_dispense_ok)) {
                        id(dispensed_ok_count)++;
                      } else {
                        id(feeder_fault) = true;
                      }
                  - delay: 500ms
      - lambda: |-
          id(dispense_in_progress) = false;
          int actual = id(dispensed_ok_count);
          if (actual > 0) {
            id(daily_fed_portions_count) += actual;
            char buf_p[32];
            sprintf(buf_p, "%d portions", id(daily_fed_portions_count));
            id(daily_fed_portions).publish_state(buf_p);

            char buf_g[32];
            sprintf(buf_g, "%.1f g", (float)id(daily_fed_portions_count) * id(gram_per_portion).state);
            id(daily_fed_grams).publish_state(buf_g);

            char buf[64];
            auto t = id(sntp_time).now();
            if (t.is_valid()) {
              t.strftime(buf, sizeof(buf), "%H:%M:%S");
              id(last_fed_time_str) = std::string(buf) + " (" + std::to_string(actual) + " portions)";
            } else {
              snprintf(buf, sizeof(buf), "Emergency feeding (%d portions)", actual);
              id(last_fed_time_str) = std::string(buf);
            }
            id(last_fed_time).publish_state(id(last_fed_time_str));
          }

          if (id(feeder_fault)) {
            id(feeder_status).publish_state("Fault: check motor / clear jam");
          } else {
            id(feeder_status).publish_state("Ready");
          }

  # Per-minute evaluation of the 8 schedules with daily limit check
  - id: check_schedules
    mode: single
    then:
      - lambda: |-
          auto time_now = id(sntp_time).now();
          if (!time_now.is_valid() || id(dispense_in_progress)) return;

          // Dedupe: process each calendar minute only once
          // (on_time and on_time_sync can both fire in the same minute)
          int key = time_now.day_of_year * 1440 + time_now.hour * 60 + time_now.minute;
          if (key == id(last_schedule_key)) return;
          id(last_schedule_key) = key;

          // Daily midnight reset
          if (id(last_midnight_day) != time_now.day_of_year) {
            id(last_midnight_day) = time_now.day_of_year;
            id(daily_fed_portions_count) = 0;
            id(daily_fed_portions).publish_state("0 portions");
            id(daily_fed_grams).publish_state("0.0 g");
          }

          int cur_h = time_now.hour;
          int cur_m = time_now.minute;

          int portions_to_dispense = 0;

          if (id(m1_portions).state > 0 && id(m1_time).hour == cur_h && id(m1_time).minute == cur_m) {
            portions_to_dispense += (int)id(m1_portions).state;
          }
          if (id(m2_portions).state > 0 && id(m2_time).hour == cur_h && id(m2_time).minute == cur_m) {
            portions_to_dispense += (int)id(m2_portions).state;
          }
          if (id(m3_portions).state > 0 && id(m3_time).hour == cur_h && id(m3_time).minute == cur_m) {
            portions_to_dispense += (int)id(m3_portions).state;
          }
          if (id(m4_portions).state > 0 && id(m4_time).hour == cur_h && id(m4_time).minute == cur_m) {
            portions_to_dispense += (int)id(m4_portions).state;
          }
          if (id(m5_portions).state > 0 && id(m5_time).hour == cur_h && id(m5_time).minute == cur_m) {
            portions_to_dispense += (int)id(m5_portions).state;
          }
          if (id(m6_portions).state > 0 && id(m6_time).hour == cur_h && id(m6_time).minute == cur_m) {
            portions_to_dispense += (int)id(m6_portions).state;
          }
          if (id(m7_portions).state > 0 && id(m7_time).hour == cur_h && id(m7_time).minute == cur_m) {
            portions_to_dispense += (int)id(m7_portions).state;
          }
          if (id(m8_portions).state > 0 && id(m8_time).hour == cur_h && id(m8_time).minute == cur_m) {
            portions_to_dispense += (int)id(m8_portions).state;
          }

          if (portions_to_dispense > 0) {
            float max_p = id(max_daily_portions).state;
            if (!isnan(max_p) && max_p > 0 && (id(daily_fed_portions_count) + portions_to_dispense) > max_p) {
              ESP_LOGW("feeder", "Daily dispense limit reached for today (%d + %d > %.0f)", 
                       id(daily_fed_portions_count), portions_to_dispense, max_p);
              return;
            }
            id(dispense_multiple_portions).execute(portions_to_dispense);
          }

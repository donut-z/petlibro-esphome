# ==============================================================================
# Pet Feeder Odin (Petlibro Air PLAF108 - ESP32-C3)
# ESPHome configuration with Web Server v3, 8 feeding times & advanced emergency fallback
# ==============================================================================

esphome:
  name: feeder-Odin
  friendly_name: "Odin's Feeder"

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: arduino

logger:
  baud_rate: 0
  level: INFO

# --- Network & connections ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Prevents an automatic reboot after 15 min without wifi, so millis() can reach the emergency interval
  reboot_timeout: 0s
  ap:
    ssid: "Odin's Feeder"
    password: !secret ap_password

captive_portal:

mdns:

api:
  # Prevents a reboot after 15 min without an active Home Assistant connection
  reboot_timeout: 0s
  # Optionally enable for an encrypted connection (requires the key in Home Assistant):
  # encryption:
  #   key: !secret api_key

ota:
  platform: esphome
  # Optional OTA password:
  # password: !secret ota_password

# --- Time synchronisation (NTP) ---
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam"
    on_time:
      - seconds: 0
        then:
          - script.execute: check_schedules
    on_time_sync:
      then:
        - script.execute: check_schedules

# --- Web Server v3 (three ordered cards) ---
web_server:
  version: 3
  local: true
  # Optionally enable to protect the web interface with a username/password:
  # auth:
  #   username: !secret web_user
  #   password: !secret web_pass
  sorting_groups:
    - id: group_status
      name: "Status & Manual Control"
      sorting_weight: 10
    - id: group_schedule
      name: "Feeding Schedule (8 Times)"
      sorting_weight: 20
    - id: group_settings
      name: "Settings & Emergency Protection"
      sorting_weight: 30

# --- Persistent memory variables (flash NVS) ---
globals:
  - id: dispense_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: last_dispense_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: dispensed_ok_count
    type: int
    restore_value: no
    initial_value: '0'

  - id: feeder_fault
    type: bool
    restore_value: no
    initial_value: 'false'

  # true if the cam really left the switch after the motor started
  - id: cam_left
    type: bool
    restore_value: no
    initial_value: 'false'

  # millis() at motor start, only used for timing in the logs
  - id: dispense_t0
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # day*1440+minute of the last processed schedule minute (prevents double feeding)
  - id: last_schedule_key
    type: int
    restore_value: no
    initial_value: '-1'

  - id: daily_fed_portions_count
    type: int
    restore_value: yes
    initial_value: '0'

  - id: last_midnight_day
    type: int
    restore_value: yes
    initial_value: '-1'

  - id: last_offline_feed_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_fed_time_str
    type: std::string
    restore_value: yes
    max_restore_data_length: 64
    initial_value: '"Not fed yet"'

# --- Emergency feeding fallback (offline uptime tracking) ---
interval:
  - interval: 1min
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            return;
          }

          // Clock is offline (no internet / no NTP)
          if (!id(emergency_feeding_enabled).state) return;
          if (id(dispense_in_progress)) return;

          uint32_t now_ms = millis();
          uint32_t interval_ms = (uint32_t)(id(emergency_interval_hours).state * 3600.0f * 1000.0f);

          // First offline feeding only after at least one interval since boot
          if (id(last_offline_feed_millis) == 0) {
            if (now_ms < interval_ms) {
              return;
            }
          } else {
            if (now_ms - id(last_offline_feed_millis) < interval_ms) {
              return;
            }
          }

          // Portions: 0 = calculated automatically from the planned daily schedule
          int portions = (int)id(emergency_portions).state;
          if (portions <= 0) {
            float planned = id(m1_portions).state + id(m2_portions).state + 
                            id(m3_portions).state + id(m4_portions).state + 
                            id(m5_portions).state + id(m6_portions).state + 
                            id(m7_portions).state + id(m8_portions).state;
            if (isnan(planned) || planned < 0) planned = 0;
            float per_interval = planned * id(emergency_interval_hours).state / 24.0f;
            portions = (int)roundf(per_interval);
            if (portions < 1) portions = 1;
          }

          id(last_offline_feed_millis) = now_ms;
          ESP_LOGW("feeder", "Emergency feeding triggered because clock is offline: %d portions", portions);
          id(dispense_multiple_portions).execute(portions);

# --- PWM & status LEDs ---
output:
  - platform: ledc
    id: gpio10_red_pwm
    pin: GPIO10
    frequency: 1220Hz

light:
  - platform: status_led
    id: gpio3_status_light
    name: "Status LED"
    pin: GPIO3
    internal: true

  - platform: monochromatic
    id: gpio10_red_light
    name: "Red Fault LED"
    output: gpio10_red_pwm
    restore_mode: ALWAYS_OFF
    internal: true

# --- Switches & motor protection ---
switch:
  - platform: restart
    name: "Restart Feeder"
    entity_category: config
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 99

  - platform: gpio
    id: motor_right
    name: "Motor Right"
    pin: GPIO6
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: [motor_left]
    interlock_wait_time: 300ms

  - platform: gpio
    id: motor_left
    name: "Motor Left"
    pin: GPIO7
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: [motor_right]
    interlock_wait_time: 300ms

  - platform: gpio
    id: food_sensor_power
    name: "Food Sensor Power"
    pin: GPIO9
    restore_mode: ALWAYS_ON
    internal: true

  - platform: template
    id: emergency_feeding_enabled
    name: "Emergency Feeding When Clock Offline"
    optimistic: yes
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action: []
    turn_off_action: []
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 20

# --- Binary sensors ---
binary_sensor:
  - platform: gpio
    id: is_food_sensed
    name: "Food Present in Hopper"
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 1s
      - delayed_off: 2s
    internal: true

  - platform: gpio
    id: wall_power_connected
    name: "Mains Power Connected"
    pin:
      number: GPIO5
      inverted: true
      mode:
        pullup: true
        input: true
    entity_category: diagnostic
    internal: true

  - platform: gpio
    id: battery_power_connected
    name: "Battery Connected"
    pin:
      number: GPIO0
      mode:
        pullup: true
        input: true
    entity_category: diagnostic
    internal: true

  - platform: gpio
    id: motor_rotation_sensor
    name: "Motor Rotation Sensor"
    pin:
      inverted: true
      number: GPIO8
      mode:
        pullup: true
        input: true
    internal: true

  - platform: gpio
    id: reset_button
    name: "WiFi Reset Button"
    pin:
      number: GPIO19
      inverted: true
      mode:
        pullup: true
        input: true
    entity_category: diagnostic
    internal: true

  # Fault sensor for Home Assistant notifications
  - platform: template
    id: feeder_fault_sensor
    name: "Feeder Fault"
    device_class: problem
    lambda: |-
      return id(feeder_fault);
    web_server:
      sorting_group_id: group_status
      sorting_weight: 13

# --- Sensors ---
sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 95

  - platform: adc
    id: battery_sense_voltage
    name: "Battery Voltage"
    pin: GPIO4
    attenuation: 12db
    update_interval: 30s
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    web_server:
      sorting_group_id: group_settings
      sorting_weight: 96

  - platform: template
    id: battery_percentage
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float v = id(battery_sense_voltage).state;
      const float empty_v = 1.650;
      const float full_v = 2.095;
      // No batteries installed (pin reads ~0 V): unavailable instead of 0%
      if (isnan(v) || v < 0.5f) return NAN;
      float pct = (v - empty_v) * 100.0f / (full_v - empty_v);
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;
    web_server:
      sorting_group_id: group_status
      sorting_weight: 16

# --- Text sensors (status overview & daily counters without sparklines) ---
text_sensor:
  - platform: template
    id: food_hopper_status
    name: "Food Hopper Status"
    update_interval: 60s
    lambda: |-
      if (id(is_food_sensed).state) {
        return std::string("Enough kibble in stock");
      } else {
        return std::string("Attention: hopper almost empty / refill!");
      }
    web_server:
      sorting_group_id: group_status
      sorting_weight: 10

  - platform: template
    id: feeder_status
    name: "Feeder Status"
    lambda: |-
      if (id(dispense_in_progress)) {
        return std::string("Dispensing...");
      }
      if (id(feeder_fault)) {
        return std::string("Fault: check motor / clear jam");
      }
      return std::string("Ready");
    web_server:
      sorting_group_id: group_status
      sorting_weight: 11

  - platform: template
    id: last_fed_time
    name: "Last Feeding"
    update_interval: 30s
    lambda: |-
      return id(last_fed_time_str);
    web_server:
      sorting_group_id: group_status
      sorting_weight: 12

  - platform: template
    id: power_source
    name: "Power Source"
    update_interval: 60s
    lambda: |-
      if (id(wall_power_connected).state) {
        return std::string("Mains (adapter)");
      } else if (id(battery_power_connected).state) {
        return std::string("Backup (batteries)");
      }
      return std::string("Unknown");
    web_server:
      sorting_group_id: group_status
      sorting_weight: 15

  # Daily counters and totals (as text, without sparklines or upper/lower graphs)
  - platform: template
    id: daily_fed_portions
    name: "Fed Today (Portions)"
    update_interval: 30s
    lambda: |-
      char buf[32];
      sprintf(buf, "%d portions", id(daily_fed_portions_count));
      return std::string(buf);
    web_server:
      sorting_group_id: group_status
      sorting_weight: 20

  - platform: template
    id: daily_fed_grams
    name: "Fed Today (Grams)"
    update_interval: 30s
    lambda: |-
      char buf[32];
      float g = (float)id(daily_fed_portions_count) * id(gram_per_portion).state;
      sprintf(buf, "%.1f g", g);
      return std::string(buf);
    web_server:
      sorting_group_id: group_status
      sorting_weight: 21

  - platform: template
    id: daily_planned_portions
    name: "Planned Today (Portions)"
    update_interval: 15s
    lambda: |-
      int total_p = (int)(id(m1_portions).state + id(m2_portions).state + 
                          id(m3_portions).state + id(m4_portions).state + 
                          id(m5_portions).state + id(m6_portions).state + 
                          id(m7_portions).state + id(m8_portions).state);
      char buf[32];
      sprintf(buf, "%d portions", total_p);
      return std::string(buf);
    web_server:
      sorting_group_id: group_status
      sorting_weight: 22

  - platform: template
    id: daily_planned_grams
    name: "Planned Today (Grams)"
    update_interval: 15s
    lambda: |-
      float total_p = id(m1_portions).state + id(m2_portions).state + 
                      id(m3_portions).state + id(m4_portions).state + 
                      id(m5_portions).state + id(m6_portions).state + 
                      id(m7_portions).state + id(m8_portions).state;
      float g = total_p * id(gram_per_portion).state;
      char buf[32];
      sprintf(buf, "%.1f g", g);
      return std::string(buf);
    web_server:
      sorting_group_id: group_status
      sorting_weight: 23

# --- Datetime components (8 times - HH:MM input fields) ---
datetime:
  - platform: template
    id: m1_time
    name: "Feeding 1 - Time"
    type: time
    optimistic: yes
    initial_value: "07:30:00"
    restore_value: true
    web_server:
      sorting_group_id: group_schedule
      sorting_weight: 10

